<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="【你的名字】的小站 — 写点东西的地方">
  <title>【你的名字】· 小站</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer onload="window.__tsInit && window.__tsInit()"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="site-name" href="/">【你的名字】</a>
      <nav>
        <a href="/#guestbook">留言板</a>
        <a href="/#about">关于</a>
      </nav>
    </header>

    <main>
      <section class="home-intro" id="about">
        <h1>写点东西,放在网上。</h1>
        <p>【一句话自我介绍——比如"一个写代码的 / 在念书 / 喜欢折腾,随意写写"】</p>
      </section>

      <ul class="posts">
        <!-- 新文章发布 = 在这里加一行 <li><a href="posts/xxxx.html">标题</a><time>2026-08-25</time></li>
             样式保持一行结构,别加多余标签 -->
        <li><a href="posts/hello-world.html">第一篇:小站开张</a><time>2026-08-25</time></li>
        <li class="empty-note">(这里是占位文章,替换成你真正的第一篇)</li>
      </ul>

      <section class="guestbook" id="guestbook">
        <h2>留言板</h2>
        <p class="notes">看了文章想说两句?这里留,不会丢。</p>
        <form id="form" style="margin-top:16px;">
          <label for="name">名字(可不填)</label>
          <input id="name" type="text" maxlength="20" placeholder="你的昵称" autocomplete="nickname">
          <label for="text">想说的话</label>
          <textarea id="text" maxlength="500" placeholder="随便说点什么…" required></textarea>
          <div id="turnstile-box" style="margin:12px 0;"></div>
          <div class="form-foot">
            <button type="submit" id="btn">发送</button>
            <span class="hint" id="hint"></span>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <div>大家的留言:<div id="list"><p class="empty">加载中…</p></div></div>
      <p style="margin-top:24px;">© 2026 【你的名字】 · 有事可以发 <a href="mailto:wurui213@molt213.top">wurui213@molt213.top</a> · 这个站跑在 Cloudflare 的免费服务上,论白嫖我是认真的。</p>
      <p class="stats" id="stats" style="margin-top:6px;"></p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('form');
    const hint = document.getElementById('hint');
    const btn = document.getElementById('btn');
    const list = document.getElementById('list');
    const name = document.getElementById('name');
    const text = document.getElementById('text');
    const sitekey = '0x4AAAAAAEcTHJtlmeUlYK7S';

    // Turnstile:页面不跳转,所以脚本加载后显式渲染,保留句柄供提交后重置
    let tsWidgetId = null;
    window.__tsInit = () => {
      if (window.turnstile && tsWidgetId === null) {
        tsWidgetId = turnstile.render('turnstile-box', { sitekey, action: 'guestbook' });
      }
    };

    // 用户输入渲染前转义,防止 XSS
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    async function load() {
      const res = await fetch('/api/guestbook');
      const rows = await res.json();
      if (!rows.length) {
        list.innerHTML = '<p class="empty">还一条都没有,来抢沙发吧。</p>';
        return;
      }
      list.innerHTML = '<ul class="messages">' +
        rows.map(r => `
          <li class="msg">
            <div class="m-head">
              <span class="m-name">${escapeHtml(r.name)}</span>
              <span class="m-time">${escapeHtml(r.created_at || '')}</span>
            </div>
            <div class="m-text">${escapeHtml(r.text)}</div>
          </li>`).join('') + '</ul>';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = (window.turnstile && tsWidgetId !== null) ? turnstile.getResponse(tsWidgetId) : '';
      if (!token) {
        hint.textContent = '请先完成人机验证';
        hint.className = 'hint err';
        return;
      }
      const body = new URLSearchParams({ name: name.value, text: text.value, token });
      btn.disabled = true;
      hint.textContent = '发送中…';
      hint.className = 'hint';
      try {
        const res = await fetch('/api/guestbook', { method: 'POST', body });
        if (res.ok) {
          text.value = '';
          hint.textContent = '✅ 已收到。';
          hint.className = 'hint ok';
          if (window.turnstile && tsWidgetId !== null) turnstile.reset(tsWidgetId);
          load();
        } else {
          const err = await res.json().catch(() => ({}));
          hint.textContent = err.error || '发送失败,稍后再试。';
          hint.className = 'hint err';
        }
      } catch {
        hint.textContent = '网络似乎不太好,稍后再试。';
        hint.className = 'hint err';
      }
      btn.disabled = false;
    });

    load();

    // 页脚统计:访客计数 + 开站天数(KV 支撑,未配好则静默隐藏)
    fetch('/api/views').then(r => r.json()).then(d => {
      if (d.ok) document.getElementById('stats').textContent = `被访问过 ${d.views} 次 · 开站第 ${d.days} 天`;
    }).catch(() => {});
  </script>
</body>
</html>
