<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="【你的名字】的小站">
  <title>【你的名字】· 小站</title>
  <style>
    :root {
      --text: #1c1917;
      --text-2: #57534e;
      --text-3: #a8a29e;
      --border: #e7e5e4;
      --accent: #1d4ed8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: var(--text);
      line-height: 1.9;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

    /* ---------- 页头 ---------- */
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 28px 0; border-bottom: 1px solid var(--border);
    }
    .site-name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    header a { color: var(--text-2); text-decoration: none; font-size: 14px; }
    header a:hover { color: var(--text); text-decoration: underline; }

    /* ---------- 正文 ---------- */
    main { padding: 40px 0 24px; }

    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 20px; }
    .intro p { color: var(--text-2); margin-bottom: 14px; }
    .intro p:first-of-type { color: var(--text); }

    hr { border: none; border-top: 1px solid var(--border); margin: 36px 0; }

    h2 { font-size: 19px; font-weight: 700; margin-bottom: 14px; }
    .note { color: var(--text-3); font-size: 14px; }

    /* ---------- 留言 ---------- */
    label { display: block; font-size: 13.5px; color: var(--text-2); margin-bottom: 6px; }
    input, textarea {
      width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
      background: #fff; border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; margin-bottom: 12px;
      transition: border-color .15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 80px; resize: vertical; }
    .form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    button {
      font-family: inherit; font-size: 14.5px; font-weight: 600;
      background: var(--text); color: #fff; border: none; border-radius: 8px;
      padding: 8px 18px; cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .hint { font-size: 13px; color: var(--text-3); }
    .hint.ok { color: #15803d; }
    .hint.err { color: #b91c1c; }

    .messages { list-style: none; margin-top: 16px; }
    .msg { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .msg:last-child { border-bottom: none; }
    .m-head { display: flex; align-items: baseline; gap: 8px; }
    .m-name { font-weight: 600; font-size: 14.5px; }
    .m-time { font-size: 12.5px; color: var(--text-3); }
    .m-text { font-size: 14.5px; color: var(--text-2); word-break: break-word; }

    .empty { color: var(--text-3); font-size: 14px; margin-top: 16px; }

    /* ---------- 页脚 ---------- */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0 40px; margin-top: 36px;
      color: var(--text-3); font-size: 13px;
    }

    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      body { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="site-name">【你的名字】</span>
      <a href="#guestbook">留言板</a>
    </header>

    <main>
      <h1>你好,我是【你的名字】</h1>

      <section class="intro">
        <p>（这一段的文字之后都可以换成你自己想说的,现在是我写的占位示例——）</p>
        <p>这是我在网络上的一个小角落。电脑是旧的,网站是免费的,想法是新的。</p>
        <p>以后这里大概会放一些写的东西、做的玩意儿,以及偶尔冒出来的奇怪想法。路过的朋友,随便看看就好。</p>
      </section>

      <hr>

      <section id="guestbook">
        <h2>留言板</h2>
        <p class="note">有什么想说的,留一句吧。留言会存进数据库,刷新也不会丢。</p>
        <form id="form" style="margin-top:16px;">
          <label for="name">名字(可不填)</label>
          <input id="name" type="text" maxlength="20" placeholder="你的昵称" autocomplete="nickname">
          <label for="text">想说的话</label>
          <textarea id="text" maxlength="500" placeholder="随便说点什么…" required></textarea>
          <div class="form-foot">
            <button type="submit" id="btn">发送</button>
            <span class="hint" id="hint"></span>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <div id="list-wrap">大家的留言:<div id="list"><p class="empty">加载中…</p></div></div>
      <p style="margin-top:28px;">© 2026 · 这个站跑在 Cloudflare 的免费服务上——论白嫖,我是认真的。</p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('form');
    const hint = document.getElementById('hint');
    const btn = document.getElementById('btn');
    const list = document.getElementById('list');

    // 用户输入渲染前转义,防止 XSS
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    async function load() {
      const res = await fetch('/api/guestbook');
      const rows = await res.json();
      if (!rows.length) {
        list.innerHTML = '<p class="empty">一条留言还没有,来抢沙发吧。</p>';
        return;
      }
      list.innerHTML = '<ul class="messages">' +
        rows.map(r => `
          <li class="msg">
            <div class="m-head">
              <span class="m-name">${escapeHtml(r.name)}</span>
              <span class="m-time">${escapeHtml(r.created_at || '')}</span>
            </div>
            <div class="m-text">${escapeHtml(r.text)}</div>
          </li>`).join('') + '</ul>';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = new URLSearchParams({ name: name.value, text: text.value });
      btn.disabled = true;
      hint.textContent = '发送中…';
      hint.className = 'hint';
      try {
        const res = await fetch('/api/guestbook', { method: 'POST', body });
        if (res.ok) {
          text.value = '';
          hint.textContent = '✅ 已收到。';
          hint.className = 'hint ok';
          load();
        } else {
          hint.textContent = '发送失败,稍后再试。';
          hint.className = 'hint err';
        }
      } catch {
        hint.textContent = '网络似乎不太好,稍后再试。';
        hint.className = 'hint err';
      }
      btn.disabled = false;
    });

    load();
  </script>
</body>
</html>
